plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '1.7.21'

}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

// Hot100 资料目录包含可独立编译的 Kotlin 实现；保留目录结构便于按题目阅读。
sourceSets {
    main.kotlin.srcDirs += 'hot100'
}

test {
    useJUnitPlatform()
}
compileKotlin {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}
compileTestKotlin {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}
